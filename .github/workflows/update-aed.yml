name: Update Switzerland AED Data

on:
  schedule:
    # Läuft jeden Sonntag um 03:00 Uhr nachts UTC
    - cron: '0 3 * * 0'
  workflow_dispatch: # Erlaubt es Ihnen, das Update jederzeit manuell zu starten

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Wichtig für die Schreibrechte
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install osmtogeojson
        run: npm install -g osmtogeojson

      - name: Fetch Data from OSM France Mirror
        run: |
          # Die Overpass-Abfrage vorbereiten
          # Wir nutzen overpass.openstreetmap.fr, da dieser Server GitHub-Runner erlaubt
          cat << 'EOF' > query.oql
          [out:json][timeout:180];
          (
            node["emergency"="defibrillator"](area:3600051701);
            way["emergency"="defibrillator"](area:3600051701);
            relation["emergency"="defibrillator"](area:3600051701);
          );
          out body;
          >;
          out skel qt;
          EOF

          echo "Lade Daten vom französischen OSM-Server..."
          curl --X POST \
               --data-urlencode "data@query.oql" \
               --header "User-Agent: uMap-Schweiz-AED-Bot/1.0" \
               --fail \
               --output raw_data.json \
               "https://overpass.openstreetmap.fr/api/interpreter"

      - name: Convert to GeoJSON and Optimize
        run: |
          echo "Konvertiere in GeoJSON..."
          osmtogeojson raw_data.json > raw_geojson.json

          echo "Entferne Metadaten-Ballast..."
          # Ein ultraschnelles Inline-Node-Skript wirft alle unnötigen Tags raus
          node -e '
          const fs = require("fs");
          const data = JSON.parse(fs.readFileSync("raw_geojson.json", "utf8"));
          const allowedTags = ["name", "emergency", "description", "opening_hours", "access", "operator", "phone"];
          
          data.features.forEach(f => {
            const props = f.properties || {};
            const tags = props.tags || {};
            const cleanProps = {};
            
            allowedTags.forEach(t => {
              if (tags[t] !== undefined) cleanProps[t] = tags[t];
            });
            
            if (!cleanProps.name) cleanProps.name = "Defibrillator (AED)";
            f.properties = cleanProps;
          });
          
          fs.writeFileSync("aed_switzerland.geojson", JSON.stringify(data));
          '

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add aed_switzerland.geojson
          # Nur pushen, wenn sich wirklich Daten geändert haben
          git diff-index --quiet HEAD || git commit -m "Automatisches Update der AED-Daten (Schweiz)"
          git push
