name: Update Switzerland AED Data

on:
  schedule:
    # Läuft jeden Sonntag um 03:00 Uhr nachts UTC
    - cron: '0 3 * * 0'
  workflow_dispatch: # Erlaubt es Ihnen, das Update jederzeit manuell zu starten

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Gibt GitHub Actions die Erlaubnis, die GeoJSON-Datei zu speichern
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          npm install -g osmtogeojson
          pip install requests

      - name: Fetch and Optimize AED Data
        run: |
          cat << 'EOF' > script.py
          import requests
          import json
          import os
          from subprocess import run

          # Schweiz Area-ID für Overpass
          overpass_url = "https://overpass-api.de/api/interpreter"
          query = """
          [out:json][timeout:120];
          (
            node["emergency"="defibrillator"](area:3600051701);
            way["emergency"="defibrillator"](area:3600051701);
            relation["emergency"="defibrillator"](area:3600051701);
          );
          out body;
          >;
          out skel qt;
          """
          
          # NEU: Pflicht-Header für den Overpass-Server, um Fehler 406 zu vermeiden
          headers = {
              "User-Agent": "uMap-Schweiz-AED-Bot/1.0 (Github Actions Automated Script)",
              "Referer": "https://github.com"
          }
          
          print("Lade Daten von Overpass API...")
          response = requests.post(overpass_url, data={'data': query}, headers=headers)
          response.raise_for_status()
          
          with open("raw_data.json", "w", encoding="utf-8") as f:
              f.write(response.text)

          print("Konvertiere in GeoJSON...")
          with open("raw_geojson.json", "w", encoding="utf-8") as out_f:
              run(["osmtogeojson", "raw_data.json"], stdout=out_f, check=True)

          print("Optimiere GeoJSON und entferne Ballast...")
          with open("raw_geojson.json", "r", encoding="utf-8") as f:
              geojson = json.load(f)

          allowed_tags = {"name", "emergency", "description", "opening_hours", "access", "operator", "phone"}

          for feature in geojson.get("features", []):
              props = feature.get("properties", {})
              cleaned_props = {}
              
              osm_tags = props.get("tags", {})
              for tag in allowed_tags:
                  if tag in osm_tags:
                      cleaned_props[tag] = osm_tags[tag]
              
              if "name" not in cleaned_props:
                  cleaned_props["name"] = "Defibrillator (AED)"

              feature["properties"] = cleaned_props

          with open("aed_switzerland.geojson", "w", encoding="utf-8") as f:
              json.dump(geojson, f, ensure_ascii=False, separators=(',', ':'))

          print("Optimierung abgeschlossen!")
          EOF
          python script.py

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add aed_switzerland.geojson
          git diff-index --quiet HEAD || git commit -m "Automatisches Update der AED-Daten (Schweiz)"
          git push
